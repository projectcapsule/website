name: docs-lint
permissions: {}

on:
  push:
    branches: [ "*" ]
    paths:
      - '.github/workflows/docs-lint.yml'
      - 'content/**'
      - 'Taskfile.yml'
      - 'devbox.json'
      - 'devbox.lock'
  pull_request:
    branches: [ "*" ]
    paths:
      - '.github/workflows/docs-lint.yml'
      - 'content/**'
      - 'Taskfile.yml'
      - 'devbox.json'
      - 'devbox.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          fetch-depth: 0
      - uses: jetify-com/devbox-install-action@a0d2d53632934ae004f878c840055956d9f741b0 # v0.14.0
        with:
          devbox-version: '0.18.4'
          enable-cache: true
      - run: devbox run task docs-lint
